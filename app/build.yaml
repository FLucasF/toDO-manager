targets:
  $default:
    builders:
      drift_dev:
        options:
          # Dates stored as ISO-8601 text (readable in the database, no time zone ambiguity).
          store_date_time_values_as_text: true
          # Frozen schema per version plus generated migration tests.
          databases:
            app: lib/data/db/database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
