include: package:flutter_lints/flutter.yaml

analyzer:
  # Tipagem no máximo: nada de cast implícito, inferência que cai em dynamic ou tipos genéricos sem argumento.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Retorno ignorado de Future costuma esconder erro de gravação no banco.
    unawaited_futures: error
    missing_return: error
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - windows/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - unawaited_futures
    - use_super_parameters

formatter:
  page_width: 150
